name: Receipt OCR frontend checks

on:
  push:
    branches:
      - fix/receipt-ocr-reliability-full-review
    paths:
      - "frontend/**"
      - ".github/workflows/receipt-ocr-frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/receipt-ocr-frontend.yml"

jobs:
  receipt-ocr:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Prepare locally hosted OCR engine and language model
        run: npm run prebuild
      - name: Run receipt OCR parser regression tests
        run: npm run test:receipt-ocr
      - name: Run frontend lint
        run: npm run lint
      - name: Build the frontend
        run: npm run build
